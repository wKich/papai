<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>afk-runner board</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0d1117;
        --panel: #161b22;
        --edge: #30363d;
        --text: #e6edf3;
        --dim: #8b949e;
        --pending: #d29922;
        --running: #58a6ff;
        --finished: #3fb950;
        --failed: #f85149;
        --bar: #1f6feb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 4px 0 2px;
      }
      .sub {
        color: var(--dim);
        font-size: 12px;
        margin-bottom: 10px;
      }
      .totals {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .totals b {
        font-weight: 600;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-left-width: 4px;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .card:active {
        filter: brightness(1.15);
      }
      .card.gate-pending {
        border-left-color: var(--pending);
      }
      .card.running {
        border-left-color: var(--running);
      }
      .card.finished {
        border-left-color: var(--finished);
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .name {
        font-weight: 650;
        font-size: 15px;
        overflow-wrap: anywhere;
      }
      .pill {
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 999px;
        white-space: nowrap;
        border: 1px solid var(--edge);
        color: var(--dim);
      }
      .pill.gate-pending {
        color: var(--pending);
        border-color: var(--pending);
      }
      .pill.running {
        color: var(--running);
        border-color: var(--running);
      }
      .pill.finished {
        color: var(--finished);
        border-color: var(--finished);
      }
      .meta {
        color: var(--dim);
        font-size: 12.5px;
        margin-top: 3px;
      }
      .gate-line {
        color: var(--pending);
        font-size: 12.5px;
        margin-top: 3px;
      }
      .walk {
        font-size: 12.5px;
        margin-top: 3px;
        color: var(--text);
      }
      .walk .retry {
        color: var(--pending);
      }
      .walk .dead {
        color: var(--failed);
      }
      .bar {
        height: 4px;
        background: var(--edge);
        border-radius: 2px;
        margin-top: 6px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--bar);
      }
      .empty {
        color: var(--dim);
        text-align: center;
        padding: 40px 0;
      }
      .error {
        color: var(--failed);
        text-align: center;
        padding: 40px 0;
      }
      section.detail {
        display: none;
      }
      .back {
        background: none;
        border: 1px solid var(--edge);
        color: var(--text);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 14px;
        margin: 14px 0 6px;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      td,
      th {
        text-align: left;
        padding: 4px 6px;
        border-bottom: 1px solid var(--edge);
      }
      th {
        color: var(--dim);
        font-weight: 500;
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
        padding: 10px;
        overflow-x: auto;
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .stages {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 12px;
      }
      .stage {
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 2px 8px;
        color: var(--dim);
      }
      .stage.active {
        color: var(--running);
        border-color: var(--running);
      }
      .stage.done {
        color: var(--finished);
        border-color: var(--finished);
      }
      ul.events {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 12.5px;
      }
      ul.events li {
        padding: 3px 0;
        border-bottom: 1px solid var(--edge);
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      ul.events li b {
        color: var(--text);
        font-weight: 500;
      }
      .todos {
        font-size: 12.5px;
      }
      .strip {
        border: 1px solid var(--edge);
        border-left: 3px solid var(--running);
        border-radius: 8px;
        padding: 6px 10px;
        margin-bottom: 6px;
        font-size: 12.5px;
      }
      .strip .strip-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: baseline;
      }
      .strip .strip-agent {
        font-weight: 600;
      }
      .strip .strip-ticker {
        color: var(--running);
        white-space: nowrap;
      }
      .strip .strip-meta {
        color: var(--dim);
        margin-top: 2px;
        overflow-wrap: anywhere;
      }
      .strip .strip-tool b {
        color: var(--text);
        font-weight: 500;
      }
      .load-earlier {
        display: block;
        width: 100%;
        background: none;
        border: 1px dashed var(--edge);
        color: var(--dim);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 12.5px;
        margin: 6px 0;
      }
      .load-earlier:disabled {
        opacity: 0.5;
      }
      .earlier {
        opacity: 0.75;
      }
      .todo-agent {
        margin-top: 8px;
        font-weight: 600;
      }
      .todo-agent .todo-age {
        color: var(--dim);
        font-weight: 400;
      }
      .todo-item {
        padding: 1px 0 1px 10px;
        overflow-wrap: anywhere;
      }
      .todo-glyph.completed {
        color: var(--finished);
      }
      .todo-glyph.in_progress {
        color: var(--running);
      }
      .todo-glyph.pending {
        color: var(--dim);
      }
      .conn {
        font-size: 11px;
        color: var(--dim);
      }
      .conn.live {
        color: var(--finished);
      }
    </style>
  </head>
  <body>
    <main>
      <section id="portfolio">
        <h1>afk-runner board</h1>
        <div class="sub">read-only · live <span id="conn" class="conn">connecting…</span></div>
        <div id="totals" class="totals"></div>
        <div id="cards"></div>
      </section>
      <section id="detail" class="detail">
        <button class="back" id="back">← portfolio</button>
        <div id="detail-body"></div>
      </section>
    </main>
    <script>
      'use strict'
      const token = new URLSearchParams(location.search).get('token') ?? ''
      const withToken = (path) => `${path}?token=${encodeURIComponent(token)}`
      let selectedRun = null
      let lastPortfolio = null

      const $ = (id) => document.getElementById(id)
      function el(tag, className, text) {
        const node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined) node.textContent = text
        return node
      }
      function fmtTokens(tokens) {
        if (tokens === null) return '—'
        if (tokens < 1000) return String(tokens)
        if (tokens < 1_000_000) return `${Math.round(tokens / 100) / 10}K`
        if (tokens < 1_000_000_000) return `${Math.round(tokens / 10_000) / 100}M`
        return `${Math.round(tokens / 10_000_000) / 100}B`
      }
      function fmtDuration(ms) {
        if (ms === null) return '—'
        const s = ms / 1000
        if (s < 60) return `${Math.round(s)}s`
        const m = s / 60
        if (m < 60) return `${Math.round(m)}m`
        const h = m / 60
        if (h < 24) return `${Math.round(h)}h`
        return `${Math.round((h / 24) * 10) / 10}d`
      }
      function fmtWhen(ts) {
        if (!ts) return '—'
        return new Date(ts).toLocaleString(undefined, {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
        })
      }
      function spendText(spend) {
        const tokens = fmtTokens(spend.tokens)
        const cost = spend.costKnown && spend.costUsd !== null ? `≥ $${spend.costUsd.toFixed(2)}` : 'cost unavailable'
        return `${tokens} tok · ${cost}`
      }

      function renderTotals(totals) {
        const node = $('totals')
        node.replaceChildren()
        const cost = `≥ $${totals.costUsd.toFixed(2)}`
        const items = [
          `${totals.runs} runs`,
          `${totals.gatePending} need you`,
          `${totals.running} running`,
          `${totals.finished} finished`,
          `${fmtTokens(totals.tokens)} tok`,
          totals.unpricedCount === 0 ? cost : `${cost} · ${totals.unpricedCount} unpriced`,
        ]
        for (const item of items) node.append(el('span', null, item))
      }

      function taskLine(card) {
        const progress = card.taskProgress
        if (progress === null) return null
        const line = el('div', 'walk')
        line.append(el('span', null, `${progress.done}/${progress.total} tasks`))
        if (progress.retrying.length > 0) {
          line.append(el('span', 'retry', ` · retrying ${progress.retrying.join(', ')}`))
        }
        if (progress.failed.length > 0) {
          line.append(el('span', 'dead', ` · failed ${progress.failed.join(', ')}`))
        }
        return line
      }

      function renderCards(portfolio) {
        renderTotals(portfolio.totals)
        const host = $('cards')
        host.replaceChildren()
        if (portfolio.cards.length === 0) {
          host.append(el('div', 'empty', 'no runs in this work dir yet'))
          return
        }
        const maxTokens = Math.max(1, ...portfolio.cards.map((card) => card.spend.tokens ?? 0))
        for (const card of portfolio.cards) {
          const node = el('div', `card ${card.attention}`)
          const top = el('div', 'row')
          top.append(el('span', 'name', card.changeName || card.runId))
          top.append(el('span', `pill ${card.attention}`, card.status))
          node.append(top)
          const meta = [card.stage, card.round === null ? null : `round ${card.round.current}/${card.round.cap}`]
            .filter((part) => part !== null)
            .join(' · ')
          if (meta) node.append(el('div', 'meta', meta))
          if (card.gate !== null) {
            const age = card.gate.pendingAgeMs === null ? '' : ` · waiting ${fmtDuration(card.gate.pendingAgeMs)}`
            node.append(
              el('div', 'gate-line', `gate ${card.gate.mode} v${card.gate.version}${age} · ${card.gate.gateFile}`),
            )
          }
          const walk = taskLine(card)
          if (walk !== null) node.append(walk)
          node.append(
            el(
              'div',
              'meta',
              `${spendText(card.spend)} · wall ${fmtDuration(card.wallMs)} · last ${fmtWhen(card.lastActivity)}`,
            ),
          )
          const bar = el('div', 'bar')
          const fill = el('i')
          fill.style.width = `${Math.round(((card.spend.tokens ?? 0) / maxTokens) * 100)}%`
          bar.append(fill)
          node.append(bar)
          node.addEventListener('click', () => openDetail(card.runId))
          host.append(node)
        }
      }

      function todoGlyph(status) {
        if (status === 'completed') return '✓'
        if (status === 'in_progress') return '→'
        return '·'
      }

      function renderTodos(detail, host) {
        if (detail.todos.length === 0) return
        host.append(el('h2', null, 'agent todos (agent-emitted)'))
        const panel = el('div', 'todos')
        for (const entry of detail.todos) {
          const head = el('div', 'todo-agent')
          head.append(el('span', null, entry.agent))
          const ageMs = Date.now() - Date.parse(entry.updatedAt)
          if (Number.isFinite(ageMs)) {
            head.append(el('span', 'todo-age', ` · ${fmtDuration(Math.max(0, ageMs))}`))
          }
          panel.append(head)
          for (const item of entry.items) {
            const line = el('div', 'todo-item')
            line.append(el('span', `todo-glyph ${item.status}`, `${todoGlyph(item.status)} `))
            line.append(document.createTextNode(item.content))
            panel.append(line)
          }
        }
        host.append(panel)
      }

      function renderStageAccounts(detail, host) {
        if (detail.stageAccounts.length === 0) return
        host.append(el('h2', null, 'stages — wall · tokens · cost (occupancy)'))
        const table = el('table')
        const header = el('tr')
        for (const label of ['stage', 'wall', 'tokens', 'cost']) header.append(el('th', null, label))
        table.append(header)
        for (const account of detail.stageAccounts) {
          const row = el('tr')
          row.append(el('td', null, account.stage))
          row.append(el('td', null, fmtDuration(account.wallMs)))
          row.append(el('td', null, fmtTokens(account.tokens)))
          row.append(el('td', null, account.costKnown ? `≥ $${account.costUsd.toFixed(2)}` : 'cost ?'))
          table.append(row)
        }
        host.append(table)
      }

      function renderStrips(detail, host) {
        if (detail.strips.length === 0) return
        host.append(el('h2', null, 'in flight'))
        for (const strip of detail.strips) {
          const node = el('div', 'strip')
          const head = el('div', 'strip-head')
          head.append(el('span', 'strip-agent', strip.agent))
          const cost = strip.costUsd > 0 ? ` · $${strip.costUsd.toFixed(2)}` : ''
          head.append(el('span', 'strip-ticker', `${fmtTokens(strip.tokens)} tok${cost}`))
          node.append(head)
          node.append(el('div', 'strip-meta', `${strip.role} · ${strip.model}`))
          if (strip.lastTool !== null) {
            const arg = strip.lastTool.arg === null ? '' : ` ${strip.lastTool.arg}`
            const line = el('div', 'strip-meta strip-tool')
            line.append(el('b', null, strip.lastTool.tool))
            line.append(document.createTextNode(arg))
            node.append(line)
          }
          node.append(el('div', 'strip-meta', strip.transcript))
          host.append(node)
        }
      }

      function feedItem(event) {
        const item = el('li')
        item.append(el('b', null, `#${event.seq} `))
        item.append(document.createTextNode(`${event.summary} · ${fmtWhen(event.ts)}`))
        return item
      }

      // Load-earlier state (tool-reports D3): the one deliberate client-side
      // cache — pages prepended below the live window, kept per open run and
      // discarded on back-navigation. Below-tail pages are immutable, so each
      // page is fetched at most once per open run.
      const earlierPages = new Map()
      const earlierExhausted = new Map()
      let loadingEarlier = false

      async function loadEarlier(runId, before) {
        if (loadingEarlier) return
        loadingEarlier = true
        try {
          const response = await fetch(
            withToken(`/api/runs/${encodeURIComponent(runId)}/events?before=${before}&limit=100`),
          )
          if (!response.ok) throw new Error(`events page: HTTP ${response.status}`)
          const payload = await response.json()
          const fetched = payload.events ?? []
          if (fetched.length === 0) {
            earlierExhausted.set(runId, true)
            return
          }
          const cached = earlierPages.get(runId) ?? []
          earlierPages.set(runId, [...fetched, ...cached])
        } finally {
          loadingEarlier = false
        }
      }

      function renderFeed(detail, host) {
        host.append(el('h2', null, 'events'))
        const live = detail.recentEvents
        const cached = earlierPages.get(detail.runId) ?? []
        const firstLive = live[0]?.seq ?? Number.POSITIVE_INFINITY
        const earlier = cached.filter((event) => event.seq < firstLive)
        const list = el('ul', 'events')
        if (earlier.length > 0) {
          for (const event of earlier) {
            const item = feedItem(event)
            item.classList.add('earlier')
            list.append(item)
          }
        }
        for (const event of live) list.append(feedItem(event))
        if (earlierExhausted.get(detail.runId) !== true && (earlier.length > 0 || live.length > 0)) {
          const firstSeq = (earlier[0] ?? live[0])?.seq
          if (firstSeq !== undefined) {
            const button = el('button', 'load-earlier', 'load earlier events')
            button.addEventListener('click', async () => {
              const scroll = document.scrollingElement ?? document.body
              const heightBefore = scroll.scrollHeight
              button.disabled = true
              try {
                await loadEarlier(detail.runId, firstSeq)
              } catch (error) {
                button.textContent = error instanceof Error ? error.message : String(error)
                return
              }
              // full re-render; then hold the reading position: the prepended
              // height is added to scrollTop once (D5)
              await openDetail(detail.runId)
              const added = scroll.scrollHeight - heightBefore
              if (added > 0) scroll.scrollTop += added
            })
            host.append(button)
          }
        }
        host.append(list)
      }

      function renderDetail(detail) {
        const host = $('detail-body')
        host.replaceChildren()
        host.append(el('h1', null, detail.changeName || detail.runId))
        host.append(el('div', 'sub', `${detail.status} · ${detail.attention}`))

        const stages = el('div', 'stages')
        for (const [stage, status] of Object.entries(detail.stages)) {
          stages.append(el('span', `stage ${status}`, stage))
        }
        host.append(stages)
        const head = [
          detail.depth === null ? null : `depth ${detail.depth}`,
          detail.round === null ? null : `round ${detail.round.current}/${detail.round.cap}`,
          detail.position,
        ]
          .filter((part) => part !== null)
          .join(' · ')
        if (head) host.append(el('div', 'meta', head))
        host.append(
          el(
            'div',
            'meta',
            `${spendText(detail.spend)} · wall ${fmtDuration(detail.wallMs)} · last ${fmtWhen(detail.lastActivity)}`,
          ),
        )

        if (detail.rounds.length > 0) {
          host.append(el('h2', null, 'review rounds'))
          const table = el('table')
          const header = el('tr')
          for (const label of ['round', 'verdict', 'raised', 'open']) header.append(el('th', null, label))
          table.append(header)
          for (const round of detail.rounds) {
            const row = el('tr')
            row.append(el('td', null, String(round.round)))
            row.append(el('td', null, round.verdict))
            row.append(el('td', null, `${round.raised.blocker}b ${round.raised.material}m ${round.raised.nitpick}n`))
            row.append(el('td', null, `${round.open.blocker}b ${round.open.material}m ${round.open.nitpick}n`))
            table.append(row)
          }
          host.append(table)
        }

        if (detail.tasks.length > 0) {
          host.append(el('h2', null, 'task walk'))
          const table = el('table')
          const header = el('tr')
          for (const label of ['task', 'status', 'attempts']) header.append(el('th', null, label))
          table.append(header)
          for (const task of detail.tasks) {
            const row = el('tr')
            row.append(el('td', null, task.id))
            row.append(el('td', null, task.status))
            row.append(el('td', null, String(task.attempts)))
            table.append(row)
          }
          host.append(table)
        }

        renderStageAccounts(detail, host)
        renderTodos(detail, host)
        renderStrips(detail, host)

        if (detail.gate !== null) {
          host.append(
            el('h2', null, `gate ${detail.gate.mode} v${detail.gate.version} — ${detail.gate.file} (read-only)`),
          )
          const pre = el('pre')
          pre.textContent = detail.gate.content ?? '(gate file not readable)'
          host.append(pre)
        }

        renderFeed(detail, host)
      }

      async function openDetail(runId) {
        selectedRun = runId
        $('portfolio').style.display = 'none'
        $('detail').style.display = 'block'
        try {
          const response = await fetch(withToken(`/api/runs/${encodeURIComponent(runId)}`))
          if (!response.ok) throw new Error(`run ${runId}: HTTP ${response.status}`)
          renderDetail(await response.json())
        } catch (error) {
          $('detail-body').replaceChildren(el('div', 'error', error instanceof Error ? error.message : String(error)))
        }
      }

      function showPortfolio() {
        // the page cache is ephemeral per open run — discarded on back-navigation (D3)
        earlierPages.clear()
        earlierExhausted.clear()
        selectedRun = null
        $('detail').style.display = 'none'
        $('portfolio').style.display = 'block'
        if (lastPortfolio !== null) renderCards(lastPortfolio)
      }
      $('back').addEventListener('click', showPortfolio)

      // Live detail (web-board D3): one in-flight re-fetch; a snapshot during a
      // fetch marks dirty and refetches once after — bursts cannot flood.
      let detailFetching = false
      let detailDirty = false
      async function refreshOpenDetail() {
        if (detailFetching) {
          detailDirty = true
          return
        }
        if (selectedRun === null) {
          detailDirty = false
          return
        }
        detailFetching = true
        try {
          await openDetail(selectedRun)
        } finally {
          detailFetching = false
          if (detailDirty) {
            detailDirty = false
            void refreshOpenDetail()
          }
        }
      }

      async function refresh() {
        try {
          const response = await fetch(withToken('/api/portfolio'))
          if (!response.ok) throw new Error(`HTTP ${response.status}`)
          lastPortfolio = await response.json()
          if (selectedRun === null) renderCards(lastPortfolio)
          else await openDetail(selectedRun)
        } catch (error) {
          $('cards').replaceChildren(el('div', 'error', error instanceof Error ? error.message : String(error)))
        }
      }

      function connectEvents() {
        const source = new EventSource(withToken('/events'))
        const mark = (live) => {
          $('conn').textContent = live ? '· live' : '· reconnecting…'
          $('conn').className = `conn${live ? ' live' : ''}`
        }
        source.addEventListener('snapshot', (event) => {
          mark(true)
          try {
            lastPortfolio = JSON.parse(event.data)
            if (selectedRun === null) renderCards(lastPortfolio)
            else void refreshOpenDetail()
          } catch {
            /* a partial frame — the next snapshot re-renders */
          }
        })
        source.onopen = () => mark(true)
        source.onerror = () => mark(false)
      }

      refresh().then(connectEvents)
    </script>
